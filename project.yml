name: MoWangDa
options:
  bundleIdPrefix: com.wuhan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  MoWangDa:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
      - Shared
      - Resources
    dependencies:
      - target: MoWangDaWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wuhan.mowangda
        PRODUCT_NAME: MoWangDa
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: App.entitlements

  MoWangDaWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wuhan.mowangda.widget
        PRODUCT_NAME: MoWangDaWidget
        INFOPLIST_FILE: Widget/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        SKIP_INSTALL: "YES"

schemes:
  MoWangDa:
    build:
      targets:
        MoWangDa: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
